<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive AI algorithm visualizer — trace N-Queens, 8-Puzzle, Tic-Tac-Toe Minimax, and Forward/Backward Chaining step by step." />
    <title>AlgoTrace · AI Algorithm Visualizer</title>
    <!-- Apply saved theme before first paint to prevent flash -->
    <script>
      (function() {
        var t = localStorage.getItem('algotrace-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
